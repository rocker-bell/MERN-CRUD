name: Deploy Python DOM Example

'on':
  push:
    branches:
      - 'MERN/DJANGO'
    paths:
      - 'python-dom-example/**'
      - '.github/workflows/deploy-python-example.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: MERN/DJANGO

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Python example
        uses: actions/upload-pages-artifact@v3
        with:
          path: python-dom-example

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4